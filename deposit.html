<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/deposit.css">

</head>
<body>
    <header>
        <h1>Alke Wallet</h1>
    </header>
    <main class="container flex-fill d-flex justify-content-center align-items-center">

        <div class="card shadow-lg border-0 rounded-4" style="max-width:500px; width:100%;">

            <div class="card-body p-4">

                <h2 class="text-center mb-4">
                    Depositar dinero
                </h2>

                <div class="alert alert-light border">

                    <small class="text-muted">
                        Saldo disponible
                    </small>

                    <h3 class="mb-0 text-black">
                        $42.584
                    </h3>

                </div>

                <form>

                    <div class="mb-4">

                        <label for="depositAmount" class="form-label">
                            Monto a depositar
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">$</span>

                            <input
                                type="number"
                                id="depositAmount"
                                class="form-control"
                                placeholder="Ingrese el monto">

                        </div>

                    </div>

                    <div class="d-flex justify-content-between">

                        <a href="menu.html"
                           class="btn btn-outline-secondary">
                            Cancelar
                        </a>

                        <button
                            type="submit"
                            class="btn btn-primary">

                            Realizar depósito

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
         <footer>
        <p>© 2026 Kevin Morales.</p>
    </footer>

</body>
</html>
