<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/login.css">
</head>

<body>
    <header>
        <h1>Login</h1>
    </header>
    <!--este es un mensaje de alerta que se desvanece-->
    <svg xmlns="http://www.w3.org/2000/svg" class="d-none">
        <symbol id="check-circle-fill" viewBox="0 0 16 16">
            <path
                d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z" />
        </symbol>
        <symbol id="info-fill" viewBox="0 0 16 16">
            <path
                d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm.93-9.412-1 4.705c-.07.34.029.533.304.533.194 0 .487-.07.686-.246l-.088.416c-.287.346-.92.598-1.465.598-.703 0-1.002-.422-.808-1.319l.738-3.468c.064-.293.006-.399-.287-.47l-.451-.081.082-.381 2.29-.287zM8 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z" />
        </symbol>
        <symbol id="exclamation-triangle-fill" viewBox="0 0 16 16">
            <path
                d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z" />
        </symbol>
    </svg>

    <div class="alert alert-dismissible fade show alert-primary" role="alert">
        <!-- <svg class="bi flex-shrink-0 me-2" role="img" aria-label="Info:"><use xlink:href="#info-fill"/></svg> -->
        <!-- pendiente boton de cerrar alerta -->
        <p>Debes Ingresar con una cuenta registrada en este banco.</p>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="cerrar">
        </button>
    </div>
    <main class="container flex-grow-1 d-flex justify-content-center align-items-center">
        <div class="card shadow rounded">
            <form class="w-100" style="max-width: 400px;" action="menu.html" method="get">
                <label for="email">Email:</label>
                <input type="email" class="form-control" id="email" placeholder="Enter email">

                <label for="password">Password:</label>
                <input type="password" class="form-control" id="password" placeholder="Enter password">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox"
                        id="form-check-33c4641c-89a2-44e1-b7d0-87632a81d67c" />
                    <label class="form-check-label" for="form-check-33c4641c-89a2-44e1-b7d0-87632a81d67c">No cerrar
                        sesión</label>
                </div>
                <button class="btn btn-primary" type="submit">Iniciar sesión</button>
            </form>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <footer>
        <p>© 2026 Kevin Morales.</p>
    </footer>

</body>

</html>
